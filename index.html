    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("dg_theme_settings") || "{}");
          var root = document.documentElement;
          if (s.accentColor) {
            var hex = s.accentColor;
            var r = parseInt(hex.slice(1, 3), 16);
            var g = parseInt(hex.slice(3, 5), 16);
            var b = parseInt(hex.slice(5, 7), 16);
            var dv = function (v) { return Math.max(0, v - 24).toString(16).padStart(2, "0"); };
            root.style.setProperty("--color-accent", hex);
            root.style.setProperty("--color-accent-hover", "#" + dv(r) + dv(g) + dv(b));
            root.style.setProperty("--color-accent-rgb", r + ", " + g + ", " + b);
          }
          if (s.mode) {
            var dark = s.mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : s.mode === "dark";
            root.setAttribute("data-theme", dark ? "dark" : "light");
          }
        } catch (e) {}
      })();
    </script>
